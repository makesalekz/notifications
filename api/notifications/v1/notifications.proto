syntax = "proto3";

package notifications.v1;

import "google/api/annotations.proto";
import "notifications/v1/models.proto";

option go_package = "gitlab.calendaria.team/services/notifications/api/notifications/v1;notifications_v1";
option java_multiple_files = true;
option java_package = "notifications.v1";

service Notifications {
	rpc CreateNotifications (CreateNotificationsRequest) returns (CreateNotificationsReply);
	rpc ListNotifications (ListNotificationsRequest) returns (ListNotificationsReply) {
		option (google.api.http) = {
			post: "/v1/notifications/list"
			body: "*"
		};
	};
	rpc GetNotificationsCounters(EmptyRequest) returns (NotificationCountersReply){
		option (google.api.http) = {
			get: "/v1/notifications/counters"
		};
	};
	rpc DoActionOnNotification(DoActionOnNotificationRequest) returns (EmptyReply){
		option (google.api.http) = {
			post: "/v1/notifications/{notificationId}/action"
			body: "*"
		};
	};
}

message CreateNotificationsRequest {
	repeated NotificationDto notifications = 1;
}

message CreateNotificationsReply {
	int32 created = 1;
}

message ListNotificationsRequest {
	string type = 1;
	PaginateRequest paginate = 2;
}

message ListNotificationsReply {
	repeated Notification notifications = 1;
	PaginateReply paginate = 2;
}

message NotificationCountersReply {
	map<string,int32> unreadCount = 1;
}

message DoActionOnNotificationRequest {
	int64 notificationId = 1;
	string action = 2;
}