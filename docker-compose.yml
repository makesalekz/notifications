version: '3.5'

services:
  service:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ${SERVICE_NAME}_service
    ports:
      - '8003:8000'
      - '9003:9000'
    networks:
      - backend
    volumes:
      - ./configs:/data/conf
    restart: unless-stopped

networks:
  backend:
    name: backend
    external: true
