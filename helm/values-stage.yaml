image:
  # image config
  repository: 
  tag: 
  pullPolicy: IfNotPresent
  imagePullSecrets:

fullnameOverride: notifications
nameOverride: notifications
namespaceOverride: stage-backend
configmap:
  private:
    enabled: false
  data:
    SERVICE_NAME: "notifications"
    CONSUL_ADDRESS: "http://10.2.5.6:8500"
    VAULT_ADDRESS: "http://10.2.4.5:8200"

server:
  replicaCount: 1
  command: ["./app","-conf","config.yaml"]
  podSecurityContext: {}
  securityContext: {}
  serviceAccount:

  resources:
    limits:
      cpu: 0.5
      memory: 0.5Gi
    requests:
      cpu: 100m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  vaultSecret:
    enabled: true
    project: stage-calendaria
    path: notifications
    files:
      - name: gserviceaccount
        envName: GOOGLE_APPLICATION_CREDENTIALS
      - name: firebase
        envName: FIREBASE_CONFIG

  nodeSelector: {}
  tolerations: []
  affinity: {}

migrateJob:
  enabled: true
  command: ["/atlas", "migrate", "apply", "--url", "$(DB_URL)", "--allow-dirty"]
