image:
  # image config
  repository: 
  tag: 
  pullPolicy: IfNotPresent
  imagePullSecrets:

fullnameOverride: notifications
nameOverride: notifications
namespaceOverride: stage-backend
configmap:
  private:
    enabled: false
  data:
    DEBUG: "1"
    SERVICE_NAME: "notifications"
    CONSUL_ADDRESS: "http://10.2.5.6:8500"
    VAULT_ADDRESS: "http://10.2.4.5:8200"


server:
  replicaCount: 1
  command: ["./notifications", "-conf", "./config.stage.yaml"]
  podSecurityContext: {}
  securityContext: {}
  serviceAccount:

  resources:
    limits:
      cpu: 0.5
      memory: 0.5Gi
    requests:
      cpu: 0.3
      memory: 0.3Gi

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

  vaultSecret:
    enabled: true
    project: stage-calendaria

  fileSecrets:
    enabled: true
    secrets:
      - name: google
        key: secret/app/notifications/gserviceaccount
        env: GOOGLE_APPLICATION_CREDENTIALS
      - name: firebase
        key: secret/app/notifications/firebase
        env: FIREBASE_CREDENTIALS

  nodeSelector: {}
  tolerations: []
  affinity: {}

migrateJob:
  enabled: true
  command: ["/atlas", "migrate", "apply", "--url", "$(DB_URL)", "--allow-dirty"]
