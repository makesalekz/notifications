<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #007BFF;
            color: #ffffff;
            padding: 10px 0;
            text-align: center;
        }
        .content {
            padding: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #ffffff;
            background-color: #007BFF;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Вы приглашены!</h1>
    </div>
    <div class="content">
        <p>Здравствуйте, Уважаемый пользователь,</p>
        <p>Вы получили приглашение! Пожалуйста, используйте ссылку ниже, чтобы присоединиться:</p>
        <p><a href="{{.InviteLink}}" class="button">Присоединиться</a></p>
        <p>Если кнопка выше не работает, пожалуйста, используйте следующую ссылку:</p>
        <p><a href="{{.InviteLink}}">{{.InviteLink}}</a></p>
    </div>
    <div class="footer">
        <p>&copy; 2024 Команда Calendaria. Все права защищены.</p>
    </div>
</div>
</body>
</html>
