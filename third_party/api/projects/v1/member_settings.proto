syntax = "proto3";

package projects.v1;

import "api/utils/v1/models.proto";

option go_package = "gitlab.calendaria.team/services/pms/projects/api/projects/v1;projects_v1";
option java_multiple_files = true;
option java_package = "projects.v1";

service PersonalSettings {
  rpc PinUnpinProject(PinUnpinRequest) returns (utils.v1.EmptyReply);
}

message PinUnpinRequest {
  int64 projectId = 1;
  bool pin = 2;
}