syntax = "proto3";

package projects.v1;

option go_package = "gitlab.calendaria.team/services/pms/projects/api/projects/v1;projects_v1";
option java_multiple_files = true;
option java_package = "projects.v1";

message Project {
  int64 id = 1;
  string title = 2;
  string mainGoal = 3;
  string businessGoal = 4;
  int64 progress = 5;
  string status = 6;
  string startDate = 7;
  string endDate = 8;
  string createdAt = 9;
  int64 createdBy = 10;
}
