syntax = "proto3";

package projects.v1;

import "api/projects/v1/models.proto";
import "api/utils/v1/models.proto";

option go_package = "gitlab.calendaria.team/services/pms/projects/api/projects/v1;projects_v1";
option java_multiple_files = true;
option java_package = "projects.v1";

service Projects {
  rpc CreateProject(CreateProjectRequest) returns (ProjectReply);
  rpc UpdateProjects(UpdateProjectRequest) returns (ProjectReply);
  rpc DeleteProjects(ProjectRequest) returns (utils.v1.EmptyReply);
  rpc GetProject(ProjectRequest) returns (ProjectReply);
  rpc AssignTeam(AssignTeamRequest) returns (utils.v1.EmptyReply);
  rpc UnassignTeam(ProjectRequest) returns (utils.v1.EmptyReply);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsReply);
}

message AssignTeamRequest {
  int64 projectId = 1;
  int64 teamId = 2;
}

message CreateProjectRequest {
  ProjectDto project = 1;
}

message UpdateProjectRequest {
  int64 projectId = 1;
  ProjectDto project = 2;
}

message ProjectDto {
  string title = 1;
  string mainGoal = 2;
  string businessGoal = 3;
  string status = 4;
  optional string startDate = 5;
  optional string endDate = 6;
  string visibility = 7;
}

message ListProjectsRequest {
  PaginateRequest paginate = 1;
}

message ListProjectsReply {
  repeated Project projects = 1;
  PaginateReply paginate = 2;
}

message PaginateRequest {
  int64 limit = 1;
  optional bool fromPinned = 2;
  optional int64 fromTeamId = 3;
  int64 fromId = 4;
}

message PaginateReply {
  int64 total = 1;
  bool fromPinned = 2;
  int64 fromTeamId = 3;
  int64 fromId = 4;
}