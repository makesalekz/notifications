syntax = "proto3";

package tasks.v1;

import "api/tasks/v1/models.proto";
import "api/utils/v1/models.proto";

option go_package = "gitlab.calendaria.team/services/pms/tasks/api/tasks/v1;tasks_v1";
option java_multiple_files = true;
option java_package = "tasks.v1";

service Tags {
  rpc CreateTag(CreateTagRequest) returns (utils.v1.EmptyReply);
  rpc ListTags(utils.v1.EmptyRequest) returns (ListTagsReply);
  rpc GetTags(GetTagsRequest) returns (GetTagsReply);
}

message CreateTagRequest {
  string name = 1;
  string type = 3;  // default TAG
}

message UpdateTagRequest {
  int64 id = 1;
  string name = 2;
}

message ListTagsReply {
  repeated Tag Tags = 1;
}

message GetTagsRequest {
  repeated int64 ids = 1;
}

message TagReply {
  Tag tag = 1;
}

message GetTagsReply {
  repeated Tag Tags = 1;
}